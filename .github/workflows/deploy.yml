name: Deploy COTHRM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'v1.0.0'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code by tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << EOF
            cd /var/www/html/cothrm

            # Fetch all tags
            git fetch --all --tags

            # Checkout the selected version
            git checkout ${{ github.event.inputs.version }}

            # Pull latest for safety
            git pull origin ${{ github.event.inputs.version }} || true

            # Restart containers
            docker compose down
            docker compose up -d --build
          EOF
